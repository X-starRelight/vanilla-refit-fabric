plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		vanilla_refit_fabric {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// 本机 16GB 内存：JVM 默认堆 = 物理内存 1/4（4GB），叠加系统其它程序后
			// Windows 提交内存被耗尽，进世界时原生内存/GPU 分配都会失败。标题界面
			// 基线测量只用 ~350MB，3G 堆足够跑世界，给系统留出余量。
			vmArg "-Xmx3G"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// 单元测试（Fabric Loader JUnit）
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// 无头自动化测试：
// - 服务端 game test（无头专用服务器）随 build 任务自动运行
// - 单元测试（src/test）随 build 任务自动运行
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vanilla_refit_fabric_test"
		enableGameTests = true
		// 有头测试：真开客户端、真建世界、真渲染再截图对比（阶段里程碑验收用）
		enableClientGameTests = true
		eula = true
	}
}

// 有头测试的 run：真开客户端。本机内存吃紧（资源重载期原生分配失败过一次），
// 这个 run 单独把堆上限压到 2G，给窗口 / GPU / JVM 内部分配留余量。
loom {
	runs {
		clientGameTest {
			vmArg "-Xmx2G"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}
